name: Spring Boot CI/CD with Tomcat

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # Step 1: Get source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Install Java 21
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Step 3: Build the application
      - name: Build Spring Boot WAR
        shell: powershell
        run: |
          mvn -B clean package -DskipTests

      # Step 4: Verify WAR file
      - name: Check WAR File
        shell: powershell
        run: |
          Get-ChildItem target

          if (!(Test-Path "target/demo-0.0.1-SNAPSHOT.war")) {
            throw "WAR file not found. Check pom.xml and target folder."
          }

      # Step 5: Deploy WAR to Tomcat
      - name: Deploy WAR to Tomcat
        shell: powershell
        env:
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASS }}
        run: |
          $pair = "$env:TOMCAT_USER`:$env:TOMCAT_PASS"

          $auth = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes($pair)
          )

          $headers = @{
            Authorization = "Basic $auth"
          }

          $response = Invoke-WebRequest `
            -Uri "http://localhost:8081/manager/text/deploy?path=/webapp1&update=true" `
            -Method Put `
            -Headers $headers `
            -InFile "target/demo-0.0.1-SNAPSHOT.war" `
            -ContentType "application/octet-stream"

          Write-Host $response.Content
